    <path class="goldline" d="M716 500h280"/>
    <path class="fine" d="M642 484l12-22 12 22 23 11-23 11-12 22-12-22-23-11Z"/>
    <text class="serif rg" x="1180" y="520" font-size="38" font-weight="500" letter-spacing="9">LOVE FOR FLORALS</text>
