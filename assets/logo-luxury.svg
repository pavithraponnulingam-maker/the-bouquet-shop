<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 620" role="img" aria-labelledby="title desc">
  <title id="title">The Bouquet Shop logo</title>
  <desc id="desc">Luxury floral logo with THE vertically on the left, Bouquet Shop in a large serif wordmark, blush rose, botanical line art, sage leaves, rose gold accents, and Love for Florals tagline.</desc>
  <defs>
    <radialGradient id="petal" cx="48%" cy="44%" r="65%">
      <stop offset="0%" stop-color="#FFF1F4"/>
      <stop offset="45%" stop-color="#E9B7C1"/>
      <stop offset="100%" stop-color="#C98593"/>
    </radialGradient>
    <linearGradient id="ink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D4549"/>
      <stop offset="55%" stop-color="#222222"/>
      <stop offset="100%" stop-color="#111416"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B67834"/>
      <stop offset="45%" stop-color="#CFA06A"/>
      <stop offset="100%" stop-color="#E4BD79"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8DDCF"/>
      <stop offset="55%" stop-color="#A8B39A"/>
      <stop offset="100%" stop-color="#6F7B65"/>
    </linearGradient>
    <filter id="roseShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#CFA06A" flood-opacity=".12"/>
    </filter>
    <style>
      .serif{font-family:"Cinzel","Playfair Display","Cormorant Garamond",Georgia,serif}
      .sans{font-family:"Inter","Montserrat",Arial,sans-serif}
      .word{fill:url(#ink)}
      .rg{fill:url(#gold)}
      .goldline{fill:none;stroke:url(#gold);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .fine{fill:none;stroke:#CFA06A;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.86}
      .botanical{fill:none;stroke:#A8B39A;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
      .leaf{fill:url(#leaf)}
      .petal{fill:url(#petal)}
    </style>
  </defs>

  <rect width="1800" height="620" fill="none"/>

  <g transform="translate(1120 188)" filter="url(#roseShadow)" opacity=".92">
    <ellipse class="petal" rx="54" ry="126" transform="rotate(0)"/>
