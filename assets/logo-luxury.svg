<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 650" role="img" aria-labelledby="title desc">
  <title id="title">The Bouquet Shop luxury floral logo</title>
  <desc id="desc">Premium floral logo with blush peony, rose gold accents, sage leaves, the business name The Bouquet Shop, and tagline Love for Florals.</desc>
  <defs>
    <radialGradient id="peonyPetal" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#F8DCE3"/>
      <stop offset="48%" stop-color="#E9B7C1"/>
      <stop offset="100%" stop-color="#C97C8E"/>
    </radialGradient>
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6D9A7"/>
      <stop offset="36%" stop-color="#CFA06A"/>
      <stop offset="70%" stop-color="#A86F3D"/>
      <stop offset="100%" stop-color="#F2C98F"/>
    </linearGradient>
    <linearGradient id="sageLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D7DDCC"/>
      <stop offset="55%" stop-color="#A8B39A"/>
      <stop offset="100%" stop-color="#637259"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#CFA06A" flood-opacity=".14"/>
    </filter>
    <style>
      .serif{font-family:"Cinzel","Playfair Display","Cormorant Garamond",Georgia,serif}
      .sans{font-family:"Inter","Montserrat",Arial,sans-serif}
      .charcoal{fill:#222222}
      .gold{fill:url(#roseGold)}
      .line{fill:none;stroke:url(#roseGold);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .thin{fill:none;stroke:#CFA06A;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:.82}
      .leaf{fill:url(#sageLeaf)}
      .petal{fill:url(#peonyPetal);opacity:.92}
    </style>
  </defs>

  <g opacity=".96" filter="url(#softShadow)">
    <g transform="translate(780 285)">
      <ellipse class="petal" rx="92" ry="196" transform="rotate(0)"/>
      <ellipse class="petal" rx="78" ry="180" transform="rotate(28)"/>
      <ellipse class="petal" rx="78" ry="180" transform="rotate(56)"/>
      <ellipse class="petal" rx="78" ry="180" transform="rotate(84)"/>
      <ellipse class="petal" rx="78" ry="180" transform="rotate(112)"/>
      <ellipse class="petal" rx="78" ry="180" transform="rotate(140)"/>
      <ellipse class="petal" rx="78" ry="180" transform="rotate(168)"/>
      <ellipse class="petal" rx="78" ry="180" transform="rotate(196)"/>
      <ellipse class="petal" rx="78" ry="180" transform="rotate(224)"/>
      <ellipse class="petal" rx="78" ry="180" transform="rotate(252)"/>
      <ellipse class="petal" rx="78" ry="180" transform="rotate(280)"/>
      <ellipse class="petal" rx="78" ry="180" transform="rotate(308)"/>
      <ellipse class="petal" rx="78" ry="180" transform="rotate(336)"/>
      <circle r="76" fill="#F3C9D2" opacity=".88"/>
      <path d="M-48 6c34-50 72-54 112-18-28 42-67 55-112 18Z" fill="#DA91A3" opacity=".65"/>
      <path d="M-13-48c48 20 70 58 58 104-47-14-76-47-58-104Z" fill="#F7D7DE" opacity=".7"/>
      <circle r="18" fill="#CFA06A" opacity=".5"/>
    </g>
  </g>

  <g opacity=".92">
    <path class="leaf" d="M445 190c-74-58-126-93-205-78 51 72 117 92 205 78Z"/>
    <path class="thin" d="M252 122c58 21 113 44 171 61"/>
    <path class="leaf" d="M1080 155c86-45 151-58 220-26-66 60-132 68-220 26Z"/>
    <path class="thin" d="M1280 132c-61 10-120 20-183 27"/>
    <path class="leaf" d="M1122 490c88 43 151 48 214 10-71-52-139-53-214-10Z"/>
    <path class="thin" d="M1314 498c-62-4-121-11-181-10"/>
    <path class="leaf" d="M430 505c-82 50-143 66-214 36 66-61 132-72 214-36Z"/>
    <path class="thin" d="M238 535c61-12 117-23 174-30"/>
  </g>

  <g>
    <path class="line" d="M303 431c102 45 225 34 340-34"/>
    <path class="line" d="M953 395c130 68 238 75 346 28"/>
    <path class="thin" d="M329 254c-42-42-86-45-126-11"/>
    <path class="thin" d="M1262 252c43-45 89-50 130-16"/>
    <path class="thin" d="M344 418c-38 11-68 33-90 68"/>
    <path class="thin" d="M1240 416c39 13 69 38 90 74"/>
    <circle cx="345" cy="254" r="8" class="gold"/>
    <circle cx="1261" cy="252" r="8" class="gold"/>
    <circle cx="345" cy="418" r="6" class="gold"/>
    <circle cx="1240" cy="416" r="6" class="gold"/>
  </g>

  <g transform="translate(150 172)">
    <text class="serif charcoal" x="0" y="0" font-size="44" font-weight="700" letter-spacing="8">T</text>
    <text class="serif charcoal" x="0" y="55" font-size="44" font-weight="700" letter-spacing="8">H</text>
    <text class="serif charcoal" x="0" y="110" font-size="44" font-weight="700" letter-spacing="8">E</text>
    <rect x="57" y="-22" width="2.5" height="168" fill="#CFA06A" opacity=".78"/>
  </g>

  <g text-anchor="middle">
    <text class="serif charcoal" x="800" y="272" font-size="104" font-weight="800" letter-spacing="13">BOUQUET</text>
    <text class="serif charcoal" x="800" y="378" font-size="88" font-weight="700" letter-spacing="15">SHOP</text>
    <path d="M565 408h470" stroke="url(#roseGold)" stroke-width="4" stroke-linecap="round"/>
    <text class="sans charcoal" x="800" y="466" font-size="24" font-weight="700" letter-spacing="10">LOVE FOR FLORALS</text>
  </g>

  <g opacity=".88">
    <path class="thin" d="M575 230c-18-22-16-47 1-66 18 22 17 45-1 66Z"/>
    <path class="thin" d="M1025 228c18-22 17-46-2-66-17 22-16 46 2 66Z"/>
    <path class="thin" d="M704 173c18-18 40-18 58-1-19 18-39 19-58 1Z"/>
    <path class="thin" d="M838 174c18-19 40-19 58-2-19 18-40 20-58 2Z"/>
  </g>
</svg>
