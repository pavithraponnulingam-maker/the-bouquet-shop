    <ellipse class="petal" rx="48" ry="118" transform="rotate(308)"/>
    <ellipse class="petal" rx="48" ry="118" transform="rotate(336)"/>
    <circle r="46" fill="#F3C8D1" opacity=".9"/>
    <path d="M-29 2c24-35 56-38 84-11-22 31-51 41-84 11Z" fill="#CB7F91" opacity=".55"/>
    <path d="M-4-31c32 14 49 41 40 72-32-11-49-33-40-72Z" fill="#FFF0F4" opacity=".66"/>
    <circle r="10" fill="#CFA06A" opacity=".5"/>
